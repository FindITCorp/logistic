name: Test Supabase Connections (Debug)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test All Connection Methods
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

      - name: Test REST API (PostgREST)
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Service role key prefix: ${SERVICE_ROLE_KEY:0:20}..."
          STATUS=$(curl -s --max-time 15 -o /tmp/r1.txt -w "%{http_code}" \
            "https://fvefwnojcqbdkcmfngnu.supabase.co/rest/v1/pools?limit=1" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}")
          echo "REST API HTTP: $STATUS"
          echo "REST API Body: $(cat /tmp/r1.txt | head -c 500)"

      - name: Test Management API GET restrictions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "PAT prefix: ${SUPABASE_ACCESS_TOKEN:0:15}"
          echo "PAT length: ${#SUPABASE_ACCESS_TOKEN}"
          STATUS=$(curl -s --max-time 15 -o /tmp/r2.txt -w "%{http_code}" \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Mgmt GET HTTP: $STATUS"
          echo "Mgmt GET Body: $(cat /tmp/r2.txt | head -c 1000)"

      - name: Test Management API PUT 0.0.0.0/0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 -o /tmp/r3.txt -w "%{http_code}" \
            -X PUT \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"dbAllowedCidrs":["0.0.0.0/0"],"dbAllowedCidrsV6":[]}')
          echo "Mgmt PUT HTTP: $STATUS"
          echo "Mgmt PUT Body: $(cat /tmp/r3.txt | head -c 1000)"

      - name: Test TCP connectivity
        run: |
          sudo apt-get install -y -qq netcat-openbsd 2>/dev/null
          for HOST in "db.fvefwnojcqbdkcmfngnu.supabase.co" "aws-0-us-east-1.pooler.supabase.com" "aws-0-us-west-1.pooler.supabase.com"; do
            for PORT in 5432 6543; do
              RESULT=$(timeout 8 nc -zv "$HOST" "$PORT" 2>&1 | tail -1)
              echo "${HOST}:${PORT} → $RESULT"
            done
          done

      - name: Commit results to repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write all test results to a file
          {
            echo "# Connection Test Results"
            echo "Date: $(date -u)"
            echo "Runner IP: $RUNNER_IP"
            echo ""
            echo "## REST API (PostgREST)"
            cat /tmp/r1.txt 2>/dev/null | head -c 1000 || echo "(empty)"
            echo ""
            echo "## Management API GET"
            cat /tmp/r2.txt 2>/dev/null | head -c 1000 || echo "(empty)"
            echo ""
            echo "## Management API PUT 0.0.0.0/0"
            cat /tmp/r3.txt 2>/dev/null | head -c 1000 || echo "(empty)"
          } > /tmp/connection-test-results.txt

          cat /tmp/connection-test-results.txt

          # Commit to repo so we can read it
          cp /tmp/connection-test-results.txt connection-test-results.txt
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add connection-test-results.txt
          git commit -m "ci: connection test results $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push || true
