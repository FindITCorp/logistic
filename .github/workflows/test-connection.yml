name: Test Supabase Connections (Debug)

on:
  workflow_dispatch:

jobs:
  test:
    name: Test All Connection Methods
    runs-on: ubuntu-latest

    steps:
      - name: Test REST API (PostgREST)
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          echo "=== Test 1: PostgREST REST API ==="
          echo "URL: $SUPABASE_URL"
          STATUS=$(curl -s -o /tmp/r1.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/pools?limit=1" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}")
          echo "HTTP: $STATUS"
          echo "Body: $(cat /tmp/r1.txt | head -c 300)"
          echo ""

      - name: Test Management API with PAT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "=== Test 2: Management API with PAT ==="
          echo "Token prefix: ${SUPABASE_ACCESS_TOKEN:0:10}"
          STATUS=$(curl -s -o /tmp/r2.txt -w "%{http_code}" \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "HTTP: $STATUS"
          echo "Body: $(cat /tmp/r2.txt | head -c 300)"
          echo ""

      - name: Test DB TCP connectivity
        run: |
          echo "=== Test 3: DB TCP ports ==="
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP"
          for HOST in "db.fvefwnojcqbdkcmfngnu.supabase.co" "aws-0-us-east-1.pooler.supabase.com" "aws-0-us-west-1.pooler.supabase.com"; do
            for PORT in 5432 6543; do
              if timeout 5 bash -c "echo > /dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
                echo "TCP OK: ${HOST}:${PORT}"
              else
                echo "TCP FAIL: ${HOST}:${PORT}"
              fi
            done
          done

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Connection Test Results"
            echo "Runner IP: $(curl -s https://checkip.amazonaws.com)"
            echo ""
            echo "### REST API (Test 1)"
            echo "\`\`\`"
            cat /tmp/r1.txt 2>/dev/null | head -c 500 || echo "(no output)"
            echo "\`\`\`"
            echo ""
            echo "### Management API (Test 2)"
            echo "\`\`\`"
            cat /tmp/r2.txt 2>/dev/null | head -c 500 || echo "(no output)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
