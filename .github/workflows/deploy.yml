name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel and capture real URL
        id: deploy
        run: |
          # Run deploy and capture ALL output
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel_out.txt || true

          echo "=== FULL VERCEL OUTPUT ==="
          cat /tmp/vercel_out.txt

          # Try to extract any https URL from output
          URL=$(cat /tmp/vercel_out.txt | sed 's/\x1b\[[0-9;]*m//g' | grep -oE "https://[a-zA-Z0-9._-]+" | grep -v "vercel.com/findit\|vercel.com/api" | tail -1)
          echo "=== EXTRACTED URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: List Vercel projects to find real URL
        id: list
        run: |
          echo "=== vercel ls output ==="
          vercel ls --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | head -30 || true

          # Get project list via API
          echo "=== Projects via API ==="
          curl -s "https://api.vercel.com/v9/projects?limit=10" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | \
            python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            for p in data.get('projects', []):
              name = p.get('name','')
              aliases = [a.get('domain','') for a in p.get('alias',[])]
              latest = p.get('latestDeployments',[{}])
              url = (latest[0].get('url','') if latest else '') or ''
              print(f'Project: {name}')
              print(f'  Aliases: {aliases}')
              print(f'  LatestURL: {url}')
          except Exception as e:
            print(f'Error: {e}')
            print(data)
          " 2>/dev/null || echo "API call failed"

      - name: Post real URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            MSG="Deploy ran — URL not captured. Check Actions logs for vercel output."
          else
            MSG="Deployed to Vercel\n\nURL: $URL"
          fi
          curl -sf -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "Comment posted" || echo "Comment failed"
