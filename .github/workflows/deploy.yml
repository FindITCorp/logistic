name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # Deploy and capture full output
          DEPLOY_OUT=$(vercel deploy --prod --yes --token=$VERCEL_TOKEN 2>&1)
          echo "$DEPLOY_OUT"

          # Extract production URL
          URL=$(echo "$DEPLOY_OUT" | grep -E "https://[a-zA-Z0-9_-]+\.vercel\.app" | tail -1 | tr -d '[:space:]')
          echo "url=$URL" >> $GITHUB_OUTPUT

          # Also get the project alias (stable URL) via API
          PROJECT_INFO=$(vercel project ls --token=$VERCEL_TOKEN 2>/dev/null | head -5 || echo "")
          echo "$PROJECT_INFO"

          echo "## Deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL de produccion:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Update NEXT_PUBLIC_SITE_URL in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then exit 0; fi

          # Find project ID
          PROJECT_ID=$(curl -s "https://api.vercel.com/v9/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import sys,json
          projects = json.load(sys.stdin).get('projects', [])
          match = next((p for p in projects if 'logistic' in p['name'].lower()), None)
          print((match or {}).get('id',''))
          " 2>/dev/null || echo "")

          if [ -n "$PROJECT_ID" ]; then
            curl -s -X DELETE "https://api.vercel.com/v10/projects/$PROJECT_ID/env/NEXT_PUBLIC_SITE_URL" \
              -H "Authorization: Bearer $VERCEL_TOKEN" > /dev/null 2>&1 || true
            curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"NEXT_PUBLIC_SITE_URL\",\"value\":\"$URL\",\"type\":\"plain\",\"target\":[\"production\"]}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('NEXT_PUBLIC_SITE_URL set to:', '$URL')" 2>/dev/null || true
          fi

      - name: Post URL as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -n "$URL" ]; then
            curl -s -X POST \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"body\":\"Deployed to Vercel\\n\\nURL: $URL\"}"
          fi
