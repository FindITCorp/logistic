name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link Vercel project
        id: link
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Get project info from Vercel API
          PROJ_DATA=$(curl -sf "https://api.vercel.com/v9/projects?limit=20" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          echo "=== AVAILABLE PROJECTS ==="
          echo "$PROJ_DATA" | python3 -c "
          import sys, json
          for p in json.load(sys.stdin).get('projects', []):
            print(f\"  {p['name']} (id={p['id']}, org={p.get('accountId','?')})\")
          " 2>/dev/null || echo "Failed to parse"

          PROJECT_ID=$(echo "$PROJ_DATA" | python3 -c "
          import sys, json
          projects = json.load(sys.stdin).get('projects', [])
          match = next((p for p in projects if 'logistic' in p.get('name','').lower()), None)
          p = match or (projects[0] if projects else None)
          print(p['id'] if p else '')
          " 2>/dev/null || echo "")

          ORG_ID=$(echo "$PROJ_DATA" | python3 -c "
          import sys, json
          projects = json.load(sys.stdin).get('projects', [])
          match = next((p for p in projects if 'logistic' in p.get('name','').lower()), None)
          p = match or (projects[0] if projects else None)
          print(p.get('accountId','') if p else '')
          " 2>/dev/null || echo "")

          PROJ_NAME=$(echo "$PROJ_DATA" | python3 -c "
          import sys, json
          projects = json.load(sys.stdin).get('projects', [])
          match = next((p for p in projects if 'logistic' in p.get('name','').lower()), None)
          p = match or (projects[0] if projects else None)
          print(p.get('name','') if p else '')
          " 2>/dev/null || echo "")

          echo "Project: $PROJ_NAME | ID: $PROJECT_ID | Org: $ORG_ID"

          if [ -n "$PROJECT_ID" ] && [ -n "$ORG_ID" ]; then
            mkdir -p .vercel
            echo "{\"projectId\":\"$PROJECT_ID\",\"orgId\":\"$ORG_ID\"}" > .vercel/project.json
            echo "Created .vercel/project.json"
            cat .vercel/project.json
          else
            echo "Could not get project/org IDs — will deploy without linking"
          fi

          echo "project_name=$PROJ_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_OUT=$(vercel deploy --prod --token=$VERCEL_TOKEN 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "=== DEPLOY OUTPUT ==="
          echo "$DEPLOY_OUT"

          URL=$(echo "$DEPLOY_OUT" | grep -oE "https://[a-zA-Z0-9._-]+" | grep "vercel\.app" | tail -1)
          echo "=== URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          PROJ="${{ steps.link.outputs.project_name }}"

          if [ -n "$URL" ]; then
            MSG="Deployed to Vercel\n\nProduction: $URL"
          elif [ -n "$PROJ" ]; then
            MSG="Deployed to Vercel project: $PROJ\n\nURL not captured — check vercel.com/dashboard"
          else
            MSG="Deploy workflow ran — check Actions logs for details"
          fi

          curl -sf -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "Comment posted" || echo "Comment failed"
