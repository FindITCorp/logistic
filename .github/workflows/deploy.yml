name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "=== Vercel account ==="
          WHOAMI=$(npx vercel whoami --token=$VERCEL_TOKEN 2>&1 || true)
          echo "$WHOAMI"

          echo "=== Deploying ==="
          DEPLOY_OUT=$(vercel deploy --prod --yes --token=$VERCEL_TOKEN 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tr -d '\r')
          echo "$DEPLOY_OUT"

          URL=$(echo "$DEPLOY_OUT" | grep -oE "https://[a-zA-Z0-9._-]+" | grep "vercel\.app" | grep -v "vercel\.app/docs" | tail -1)
          echo "=== DEPLOYED URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT

          # Get actual project domains from Vercel API
          echo "=== Project domains ==="
          PROJECT_INFO=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || true)
          echo "$PROJECT_INFO" | python3 -c "
import json,sys
try:
  d=json.load(sys.stdin)
  aliases = d.get('alias',[])
  for a in aliases:
    print('  domain:', a.get('domain',''))
  print('  name:', d.get('name',''))
  print('  id:', d.get('id',''))
except: pass
" 2>/dev/null || true
          echo "domains_raw=$PROJECT_INFO" >> $GITHUB_OUTPUT

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"

          # Also get real domains via API
          DOMAINS=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null | \
            python3 -c "
import json,sys
try:
  d=json.load(sys.stdin)
  for dom in d.get('domains',[]):
    print(dom.get('name',''))
except: pass
" 2>/dev/null || echo "")

          MSG="Deployed!\n\nURL from CLI: $URL\nDomains from API:\n$DOMAINS"

          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "ok" || echo "failed"
