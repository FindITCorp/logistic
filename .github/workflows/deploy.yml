name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "https://.*\.vercel\.app" | tail -1)
          echo "## Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://findit-logistic.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "Deploy URL: $URL"

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"body":"Deployed to Vercel\n\nhttps://findit-logistic.vercel.app"}' \
            && echo "Comment posted" || echo "Comment failed (permissions?)"
