name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Discover and link Vercel project
        id: link
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/find_vercel_project.py

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cat .vercel/project.json 2>/dev/null && echo "project.json OK" || echo "WARNING: no .vercel/project.json"
          PROJECT_ID=$(python3 -c "import json; d=json.load(open('.vercel/project.json')); print(d.get('projectId',''))" 2>/dev/null || echo "")
          ORG_ID=$(python3 -c "import json; d=json.load(open('.vercel/project.json')); print(d.get('orgId',''))" 2>/dev/null || echo "")
          echo "Deploying project: $PROJECT_ID org: $ORG_ID"
          DEPLOY_OUT=$(vercel deploy --prod --token=$VERCEL_TOKEN 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "=== RAW DEPLOY OUTPUT ==="
          echo "$DEPLOY_OUT"
          echo "=========================="
          URL=$(echo "$DEPLOY_OUT" | grep -oE "https://[a-zA-Z0-9._/-]+" | grep "vercel\.app" | tail -1)
          if [ -z "$URL" ] && [ -n "$PROJECT_ID" ]; then
            echo "URL not in CLI output, querying Vercel API..."
            TEAM_PARAM=""
            if [ -n "$ORG_ID" ] && [ "$ORG_ID" != "$PROJECT_ID" ]; then
              TEAM_PARAM="&teamId=$ORG_ID"
            fi
            URL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PROJECT_ID/deployments?limit=1&target=production${TEAM_PARAM}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); deps=d.get('deployments',[]); print(deps[0]['url'] if deps else '')" 2>/dev/null || echo "")
            if [ -n "$URL" ]; then URL="https://$URL"; fi
          fi
          echo "=== FINAL URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          PROJ="${{ steps.link.outputs.project_name }}"
          if [ -n "$URL" ]; then
            MSG="Deployed!\n\n$URL"
          elif [ -n "$PROJ" ]; then
            MSG="Deployed project: $PROJ\nURL not captured — see vercel.com/dashboard"
          else
            MSG="Deploy ran — check Actions logs"
          fi
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "ok" || echo "failed"
