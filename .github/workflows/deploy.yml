name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link and deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Vercel CLI version ==="
          vercel --version
          echo "=== Linking project ==="
          vercel link --yes --token=$VERCEL_TOKEN 2>&1 || echo "link step exited non-zero"
          echo "=== project.json ==="
          cat .vercel/project.json 2>/dev/null || echo "no project.json created"
          echo "=== Deploying ==="
          DEPLOY_OUT=$(vercel deploy --prod --token=$VERCEL_TOKEN 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tr -d '\r')
          echo "$DEPLOY_OUT"
          URL=$(echo "$DEPLOY_OUT" | grep -oE "https://[a-zA-Z0-9._-]+" | grep "vercel\.app" | tail -1)
          echo "=== URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT
          PROJECT_NAME=$(python3 -c "import json; d=json.load(open('.vercel/project.json')); print(d.get('projectId',''))" 2>/dev/null || echo "")
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          PROJ="${{ steps.deploy.outputs.project_name }}"
          if [ -n "$URL" ]; then
            MSG="Deployed!\n\n$URL"
          elif [ -n "$PROJ" ]; then
            MSG="Deployed project id: $PROJ\nURL not captured — see vercel.com/dashboard"
          else
            MSG="Deploy ran — check Actions logs"
          fi
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "ok" || echo "failed"
