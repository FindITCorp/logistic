name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link Vercel project
        id: link
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Search personal + all teams for the logistic project
          python3 << 'PYEOF'
          import subprocess, json, os

          token = os.environ['VERCEL_TOKEN']
          headers = ["-H", f"Authorization: Bearer {token}"]

          def api(path):
              r = subprocess.run(["curl","-s",f"https://api.vercel.com{path}"] + headers,
                                  capture_output=True, text=True)
              try: return json.loads(r.stdout)
              except: return {}

          # Get user/personal account
          user = api("/v2/user").get("user", {})
          uid  = user.get("id", "")
          print(f"User: {user.get('username','?')} id={uid}")

          # Collect scopes: personal + all teams
          scopes = [("personal", uid, None)]
          for t in api("/v2/teams").get("teams", []):
              scopes.append((t["name"], t["id"], t["id"]))

          # Search for logistic project across all scopes
          found = None
          for scope_name, scope_id, team_id in scopes:
              url = "/v9/projects?limit=20" + (f"&teamId={team_id}" if team_id else "")
              data = api(url)
              projects = data.get("projects", [])
              print(f"  Scope {scope_name}: {len(projects)} projects — {[p['name'] for p in projects]}")
              for p in projects:
                  if "logistic" in p["name"].lower() or not found:
                      found = (p, scope_id)
                      if "logistic" in p["name"].lower():
                          break

          if found:
              p, org_id = found
              proj_id = p["id"]
              proj_name = p["name"]
              print(f"Using: {proj_name} (id={proj_id}, org={org_id})")
              os.makedirs(".vercel", exist_ok=True)
              with open(".vercel/project.json","w") as f:
                  json.dump({"projectId": proj_id, "orgId": org_id}, f)
              # Write outputs
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                  f.write(f"project_name={proj_name}\n")
                  f.write(f"org_id={org_id}\n")
          else:
              print("No project found!")
          PYEOF

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_OUT=$(vercel deploy --prod --token=$VERCEL_TOKEN 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "=== DEPLOY OUTPUT ==="
          echo "$DEPLOY_OUT"

          URL=$(echo "$DEPLOY_OUT" | grep -oE "https://[a-zA-Z0-9._-]+" | grep "vercel\.app" | tail -1)
          echo "=== URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          PROJ="${{ steps.link.outputs.project_name }}"

          if [ -n "$URL" ]; then
            MSG="Deployed to Vercel\n\nProduction: $URL"
          elif [ -n "$PROJ" ]; then
            MSG="Deployed to Vercel project: $PROJ\n\nURL not captured — check vercel.com/dashboard"
          else
            MSG="Deploy workflow ran — check Actions logs for details"
          fi

          curl -sf -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "Comment posted" || echo "Comment failed"
