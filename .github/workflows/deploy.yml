name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          # Capture full output
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | tee /tmp/vercel_out.txt || true

          echo "=== FULL OUTPUT ==="
          cat /tmp/vercel_out.txt

          # Extract inspect URL to get deployment ID
          INSPECT=$(grep -oE "https://vercel\.com/[^ ]+" /tmp/vercel_out.txt | head -1 | tr -d '[:space:]')
          echo "Inspect URL: $INSPECT"
          echo "inspect_url=$INSPECT" >> $GITHUB_OUTPUT

      - name: Get production URL from Vercel API
        id: get_url
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          INSPECT="${{ steps.deploy.outputs.inspect_url }}"
          echo "Inspect: $INSPECT"

          # Get all projects and find the most recent production deployment
          PROD_URL=$(curl -sf "https://api.vercel.com/v6/deployments?limit=5&target=production" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "
          import sys, json
          try:
            deps = json.load(sys.stdin).get('deployments', [])
            print(f'Found {len(deps)} deployments', file=sys.stderr)
            for d in deps:
              print(f'  {d.get(\"name\",\"?\")} — {d.get(\"url\",\"?\")} — {d.get(\"state\",\"?\")}', file=sys.stderr)
            for d in deps:
              u = d.get('url','')
              if u:
                print('https://' + u if not u.startswith('http') else u)
                break
          except Exception as e:
            print(f'Error: {e}', file=sys.stderr)
          " 2>/tmp/api_debug.txt || echo "")

          cat /tmp/api_debug.txt

          # Also list all projects for reference
          echo "=== ALL PROJECTS ==="
          curl -sf "https://api.vercel.com/v9/projects?limit=20" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "
          import sys, json
          for p in json.load(sys.stdin).get('projects', []):
            print(f\"  {p['name']}: {[a.get('domain') for a in p.get('alias',[])]}\")
          " 2>/dev/null || echo "Failed"

          echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "Production URL: $PROD_URL"

      - name: Post real URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.get_url.outputs.prod_url }}"
          INSPECT="${{ steps.deploy.outputs.inspect_url }}"

          if [ -n "$URL" ]; then
            MSG="Deployed to Vercel\n\nProduction: $URL\nInspect: $INSPECT"
          else
            MSG="Deploy ran. Inspect: $INSPECT\n\nCheck Actions logs for project URL."
          fi

          curl -sf -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "Comment posted" || echo "Comment failed"
