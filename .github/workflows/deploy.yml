name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "https://.*\.vercel\.app" | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: $URL"

      - name: Get stable project URL from Vercel API
        id: project_url
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Get all projects, print full info for debugging, find logistic URL
          URL=$(curl -sf "https://api.vercel.com/v9/projects?limit=20" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            projects = data.get('projects', [])
            print('Projects found:', len(projects), file=sys.stderr)
            for p in projects:
              name = p.get('name','')
              print(f'  Project: {name}', file=sys.stderr)
              # Try alias first
              for alias in p.get('alias', []):
                domain = alias.get('domain','')
                if domain and 'vercel.app' in domain:
                  print(f'  Alias: {domain}', file=sys.stderr)
                  print('https://' + domain)
                  sys.exit(0)
              # Try latestDeployments
              for dep in p.get('latestDeployments', []):
                url = dep.get('url','')
                if url:
                  print(f'  LatestDeploy: {url}', file=sys.stderr)
                  if not url.startswith('http'):
                    url = 'https://' + url
                  print(url)
                  sys.exit(0)
          except Exception as e:
            print(f'Error: {e}', file=sys.stderr)
          " 2>&1 | grep -v "^Projects\|^  Project\|^  Alias\|^  Latest\|^Error" | head -1 || echo "")

          # Fallback: try latest deployment URL via deployments API
          if [ -z "$URL" ]; then
            URL=$(curl -sf "https://api.vercel.com/v6/deployments?limit=1&target=production" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | \
              python3 -c "
          import sys, json
          try:
            deps = json.load(sys.stdin).get('deployments', [])
            if deps:
              u = deps[0].get('url','')
              if u: print('https://' + u if not u.startswith('http') else u)
          except: pass
          " 2>/dev/null || echo "")
          fi

          # Fallback to deploy step URL
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.url }}"
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "**Stable URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "Stable URL: $URL"

      - name: Post URL as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.project_url.outputs.url }}"
          if [ -n "$URL" ]; then
            curl -s -X POST \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"body\":\"Deployed to Vercel\\n\\nURL: $URL\"}" > /dev/null
            echo "Comment posted: $URL"
          else
            echo "No URL captured"
          fi
