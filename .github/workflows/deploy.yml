name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "https://.*\.vercel\.app" | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: $URL"

      - name: Get stable project URL from Vercel API
        id: project_url
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(curl -sf "https://api.vercel.com/v9/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import sys, json
          try:
            projects = json.load(sys.stdin).get('projects', [])
            for p in projects:
              if 'logistic' in p.get('name','').lower():
                aliases = p.get('alias', [])
                if aliases:
                  domain = aliases[0].get('domain','')
                  if domain:
                    print('https://' + domain)
                    break
          except: pass
          " 2>/dev/null || echo "")

          # Fallback to deploy step URL
          if [ -z "$URL" ]; then
            URL="${{ steps.deploy.outputs.url }}"
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "**Stable URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "Stable URL: $URL"

      - name: Post URL as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.project_url.outputs.url }}"
          if [ -n "$URL" ]; then
            curl -s -X POST \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"body\":\"Deployed to Vercel\\n\\nURL: $URL\"}" > /dev/null
            echo "Comment posted: $URL"
          else
            echo "No URL captured"
          fi
