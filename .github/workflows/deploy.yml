name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1
          echo "## Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://findit-logistic.vercel.app" >> $GITHUB_STEP_SUMMARY

      - name: Post URL as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"body":"Deployed to Vercel\n\nhttps://findit-logistic.vercel.app"}'
          echo "Posted comment with URL"
