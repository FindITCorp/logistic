name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link and deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "CLI version:"
          vercel --version
          echo "--- Link ---"
          vercel link --yes --token=$VERCEL_TOKEN 2>&1 || echo "link returned non-zero"
          echo "--- project.json ---"
          cat .vercel/project.json 2>/dev/null || echo "(none)"
          echo "--- Deploy ---"
          vercel deploy --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee /tmp/deploy_out.txt
          echo "--- All URLs found ---"
          grep -oE "https://[a-zA-Z0-9._/-]+" /tmp/deploy_out.txt || echo "(no URLs)"
          echo "--- project.json after deploy ---"
          cat .vercel/project.json 2>/dev/null || echo "(none)"
          echo "--- Get URL via API ---"
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])" 2>/dev/null || echo "")
          echo "project_id: $PROJECT_ID"
          URL=""
          if [ -n "$PROJECT_ID" ]; then
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$PROJECT_ID")
            echo "Project: $RESP"
            URL=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); alias=d.get('targets',{}).get('production',{}).get('alias',[]); r=[a for a in alias if isinstance(a,str) and 'vercel.app' in a]; print('https://'+r[0] if r else '')" 2>/dev/null || echo "")
          fi
          if [ -z "$URL" ]; then
            URL=$(grep -oE "https://[a-zA-Z0-9._-]+" /tmp/deploy_out.txt | grep "vercel\.app" | tail -1 || echo "")
          fi
          echo "=== FINAL URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -n "$URL" ]; then
            MSG="Deployed!\n\n$URL"
          else
            MSG="Deploy ran — check Actions logs"
          fi
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "ok" || echo "failed"
