name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link and deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "CLI: $(vercel --version)"
          echo "--- Link ---"
          vercel link --yes --token=$VERCEL_TOKEN 2>&1 || true
          echo "--- project.json ---"
          cat .vercel/project.json 2>/dev/null || echo "(none)"
          echo "--- Deploy ---"
          vercel deploy --prod --yes --token=$VERCEL_TOKEN > /tmp/deploy_stdout.txt 2>/tmp/deploy_stderr.txt
          DEPLOY_EXIT=$?
          echo "exit code: $DEPLOY_EXIT"
          echo "=== STDOUT ===" && cat /tmp/deploy_stdout.txt
          echo "=== STDERR ===" && cat /tmp/deploy_stderr.txt
          cat /tmp/deploy_stdout.txt /tmp/deploy_stderr.txt > /tmp/deploy_all.txt
          grep -oE "https://[a-zA-Z0-9._-]+" /tmp/deploy_all.txt || echo "(no https URLs)"
          URL=$(grep -oE "https://[a-zA-Z0-9._-]+" /tmp/deploy_all.txt | grep "vercel\.app" | tail -1 || echo "")
          echo "=== URL: $URL ==="
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deploy stdout:" > /tmp/debug_output.txt
          cat /tmp/deploy_stdout.txt >> /tmp/debug_output.txt
          echo "Deploy stderr:" >> /tmp/debug_output.txt
          cat /tmp/deploy_stderr.txt >> /tmp/debug_output.txt

      - name: Commit debug output
        run: |
          cp /tmp/debug_output.txt deploy_debug.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add deploy_debug.txt
          git diff --staged --quiet || git commit -m "debug: vercel deploy output [skip ci]"
          git push origin main || true

      - name: Post URL as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -n "$URL" ]; then
            MSG="Deployed!\n\n$URL"
          else
            MSG="Deploy ran — check Actions logs or deploy_debug.txt"
          fi
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$MSG\"}" && echo "ok" || echo "failed"
