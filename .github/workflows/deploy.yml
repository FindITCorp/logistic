name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_OUT=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$DEPLOY_OUT"

          # Extract URL (strip ANSI codes, match any https URL)
          URL=$(echo "$DEPLOY_OUT" | sed 's/\x1b\[[0-9;]*m//g' | grep -oE "https://[a-zA-Z0-9._/-]+" | grep -v "vercel.com/findit" | tail -1 | tr -d '[:space:]')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "**URL del deploy:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**URL fija:** https://findit-logistic.vercel.app" >> $GITHUB_STEP_SUMMARY

      - name: Post URL as commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          FIXED_URL="https://findit-logistic.vercel.app"
          COMMENT_URL="${DEPLOY_URL:-$FIXED_URL}"
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"Deployed to Vercel\\n\\nURL: $COMMENT_URL\"}"
          echo "URL: $COMMENT_URL"
