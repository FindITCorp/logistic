name: Run Supabase Migrations

# PREREQUISITES:
# The Supabase project network must allow GitHub Actions IPs.
# This workflow auto-updates the allowlist via SUPABASE_ACCESS_TOKEN (PAT).
# If that step fails, you can also manually add 0.0.0.0/0 at:
#   https://supabase.com/dashboard/project/fvefwnojcqbdkcmfngnu/settings/network

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print SQL without executing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply SQL Migrations
    runs-on: ubuntu-latest

    env:
      PGHOST: db.fvefwnojcqbdkcmfngnu.supabase.co
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Whitelist runner IP via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          echo "=== IP Whitelist Step ==="
          echo "Token set: $([ -n "$SUPABASE_ACCESS_TOKEN" ] && echo YES || echo NO)"

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping automatic whitelist."
            echo "Ensure 0.0.0.0/0 is in the Supabase Network allowlist."
            exit 0
          fi

          RUNNER_IP=$(curl -sf --max-time 10 https://checkip.amazonaws.com || echo "unknown")
          echo "Runner IP: $RUNNER_IP"

          # GET current state
          echo "--- Current network restrictions ---"
          curl -sf --max-time 10 \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            | python3 -m json.tool || echo "(could not parse response)"

          echo ""
          echo "--- Updating to allow 0.0.0.0/0 ---"
          STATUS=$(curl -s --max-time 30 \
            -o /tmp/put_body.txt \
            -w "%{http_code}" \
            -X PUT \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"dbAllowedCidrs":["0.0.0.0/0"],"dbAllowedCidrsV6":[]}')
          BODY=$(cat /tmp/put_body.txt)
          echo "HTTP: $STATUS"
          echo "Body: $BODY"

          {
            echo "## Whitelist Step Debug"
            echo "- Runner IP: $RUNNER_IP"
            echo "- PUT HTTP: $STATUS"
            echo "- PUT Body: \`$BODY\`"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$STATUS" in
            200|201|204)
              echo "Allowlist updated successfully. Waiting 20s for propagation..."
              sleep 20
              ;;
            401)
              echo "ERROR: Unauthorized — SUPABASE_ACCESS_TOKEN is invalid or expired."
              echo "Generate a new PAT at: https://supabase.com/dashboard/account/tokens"
              exit 1
              ;;
            403)
              echo "WARNING: Forbidden — PAT may not own this project. Proceeding anyway."
              ;;
            *)
              echo "WARNING: Unexpected status $STATUS. Proceeding anyway."
              ;;
          esac

      - name: Verify DB connection
        run: |
          echo "=== Testing DB connection ==="
          echo "Host: $PGHOST:$PGPORT"
          echo "User: $PGUSER / DB: $PGDATABASE"
          # Test TCP connectivity first
          if timeout 10 bash -c "echo >/dev/tcp/$PGHOST/$PGPORT" 2>/dev/null; then
            echo "TCP port $PGPORT reachable"
          else
            echo "WARNING: TCP port $PGPORT not directly reachable (may be network-filtered)"
          fi
          # Try connecting
          psql -c "SELECT current_database() AS db, now() AS ts;" \
            && echo "DB connection OK" \
            || {
              echo ""
              echo "DB connection FAILED"
              echo "This usually means the runner IP is not in the Supabase allowlist."
              echo "Fix: https://supabase.com/dashboard/project/fvefwnojcqbdkcmfngnu/settings/network"
              echo "     Add 0.0.0.0/0 to Allowed CIDRs"
              exit 1
            }

      - name: Create migrations tracking table
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
            CREATE TABLE IF NOT EXISTS _migrations (
              id          serial PRIMARY KEY,
              filename    text UNIQUE NOT NULL,
              applied_at  timestamptz NOT NULL DEFAULT now(),
              checksum    text
            );
          SQL
          echo "Migrations tracking table ready."

      - name: Run pending migrations
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          MIGRATIONS_DIR="supabase/migrations"
          SUCCESS=0
          SKIPPED=0
          FAILED=0

          echo "=== FINDIT Logistic — Migration Runner ==="
          echo "Dry run: $DRY_RUN"
          echo ""

          for FILE in $(ls "$MIGRATIONS_DIR"/*.sql | sort); do
            BASENAME=$(basename "$FILE")
            CHECKSUM=$(sha256sum "$FILE" | awk '{print $1}')

            APPLIED=$(psql -tAc \
              "SELECT COUNT(*) FROM _migrations WHERE filename = '$BASENAME';")

            if [ "$APPLIED" -gt "0" ]; then
              echo "  SKIP  $BASENAME (already applied)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "  RUN   $BASENAME"

            if [ "$DRY_RUN" = "true" ]; then
              echo "--- DRY RUN: would execute ---"
              cat "$FILE"
              echo "------------------------------"
              SUCCESS=$((SUCCESS + 1))
            else
              if psql -v ON_ERROR_STOP=1 -f "$FILE"; then
                psql -c "INSERT INTO _migrations (filename, checksum)
                          VALUES ('$BASENAME', '$CHECKSUM')
                          ON CONFLICT (filename) DO NOTHING;"
                echo "  OK    $BASENAME"
                SUCCESS=$((SUCCESS + 1))
              else
                echo "  FAIL  $BASENAME"
                FAILED=$((FAILED + 1))
              fi
            fi
          done

          echo ""
          echo "=== Migration Summary ==="
          echo "  Applied : $SUCCESS"
          echo "  Skipped : $SKIPPED"
          echo "  Failed  : $FAILED"

          if [ "$FAILED" -gt "0" ]; then
            echo "ERROR: $FAILED migration(s) failed!"
            exit 1
          fi

          echo "All migrations completed successfully."
          {
            echo "## Migration Results"
            echo "- Applied: $SUCCESS"
            echo "- Skipped: $SKIPPED"
            echo "- Failed: $FAILED"
          } >> "$GITHUB_STEP_SUMMARY"
