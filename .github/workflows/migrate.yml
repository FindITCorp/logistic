name: Run Supabase Migrations

# Uses the Supabase Management API to run SQL migrations via HTTPS.
# Bypasses DB IP allowlist entirely. Requires SUPABASE_ACCESS_TOKEN PAT.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print SQL without executing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: write

jobs:
  migrate:
    name: Apply SQL Migrations
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: fvefwnojcqbdkcmfngnu
      MGMT_API: https://api.supabase.com/v1
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MIGRATIONS_DIR: supabase/migrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run migrations
        run: |
          echo "=== Debug Info ==="
          echo "Python: $(python3 --version)"
          echo "CWD: $(pwd)"
          echo "Script exists: $(test -f .github/scripts/migrate.py && echo YES || echo NO)"
          ls -la .github/scripts/ 2>&1 || echo "scripts dir not found"
          echo "SUPABASE_ACCESS_TOKEN set: $(test -n "$SUPABASE_ACCESS_TOKEN" && echo YES || echo NO)"
          echo "SUPABASE_ACCESS_TOKEN length: ${#SUPABASE_ACCESS_TOKEN}"
          echo "=================="
          python3 .github/scripts/migrate.py 2>&1 | tee /tmp/migrate_output.txt; EXIT=${PIPESTATUS[0]}
          echo "Exit code: $EXIT"
          cat /tmp/migrate_output.txt >> migration-results.txt
          echo "---" >> migration-results.txt
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add migration-results.txt
          git diff --staged --quiet || git commit -m "ci: debug migration output [skip ci]"
          git push origin main || true
          exit $EXIT
