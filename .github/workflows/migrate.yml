name: Run Supabase Migrations

# Uses the Supabase Management API to run SQL migrations via HTTPS.
# Bypasses DB IP allowlist entirely. Requires SUPABASE_ACCESS_TOKEN PAT.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print SQL without executing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    name: Apply SQL Migrations
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: fvefwnojcqbdkcmfngnu
      MGMT_API: https://api.supabase.com/v1
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MIGRATIONS_DIR: supabase/migrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run migrations
        run: python3 .github/scripts/migrate.py
