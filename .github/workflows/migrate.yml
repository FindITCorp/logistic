name: Run Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print SQL without executing)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    name: Apply SQL Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          PROJECT_ID="fvefwnojcqbdkcmfngnu"
          API="https://api.supabase.com/v1/projects/${PROJECT_ID}/database/query"
          SUCCESS=0
          FAILED=0
          SKIPPED=0

          run_sql() {
            local sql="$1"
            local PAYLOAD
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql")
            curl -s -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          }

          echo "=== FINDIT Logistic — Migration Runner (REST API) ==="
          echo "Dry run: $DRY_RUN"
          echo ""

          # Create tracking table
          echo "Creating _migrations tracking table if not exists..."
          run_sql "CREATE TABLE IF NOT EXISTS _migrations (id serial PRIMARY KEY, filename text UNIQUE NOT NULL, applied_at timestamptz NOT NULL DEFAULT now());" | python3 -c "import json,sys; d=json.load(sys.stdin); print('tracking table:', 'ok' if not d.get('message') else d['message'])"

          # Run each migration
          for FILE in $(ls supabase/migrations/*.sql | sort); do
            BASENAME=$(basename "$FILE")
            SQL=$(cat "$FILE")

            # Check if already applied
            CHECK=$(run_sql "SELECT COUNT(*) as n FROM _migrations WHERE filename = '$BASENAME';")
            COUNT=$(echo "$CHECK" | python3 -c "import json,sys; rows=json.load(sys.stdin); print(rows[0]['n'] if rows else '0')" 2>/dev/null || echo "0")

            if [ "$COUNT" -gt "0" ]; then
              echo "  SKIP  $BASENAME (already applied)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "  RUN   $BASENAME"

            if [ "$DRY_RUN" = "true" ]; then
              echo "--- DRY RUN ---"
              head -5 "$FILE"
              echo "..."
              SUCCESS=$((SUCCESS + 1))
              continue
            fi

            RESULT=$(run_sql "$SQL")
            ERROR=$(echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('message','') if isinstance(d,dict) else '')" 2>/dev/null || echo "")

            if [ -n "$ERROR" ] && [[ "$ERROR" != *"already exists"* ]]; then
              echo "  WARN  $BASENAME: $ERROR"
              FAILED=$((FAILED + 1))
            else
              run_sql "INSERT INTO _migrations (filename) VALUES ('$BASENAME') ON CONFLICT (filename) DO NOTHING;" > /dev/null
              echo "  OK    $BASENAME"
              SUCCESS=$((SUCCESS + 1))
            fi
          done

          echo ""
          echo "=== Summary: applied=$SUCCESS skipped=$SKIPPED warned=$FAILED ==="

          # Show tables
          echo ""
          echo "=== Tables in DB ==="
          run_sql "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;" | python3 -c "import json,sys; rows=json.load(sys.stdin); [print(' ', r['table_name']) for r in rows]" 2>/dev/null || echo "(could not list tables)"
