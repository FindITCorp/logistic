name: Run Supabase Migrations

# IMPORTANT: This workflow requires that GitHub Actions IP ranges are
# allowed in your Supabase project's network settings:
# https://supabase.com/dashboard/project/fvefwnojcqbdkcmfngnu/settings/network
#
# Option A (recommended): Add 0.0.0.0/0 to allowlist in Supabase dashboard
#   (Settings > Network > Allowed CIDRs)
#
# Option B: Add a GitHub secret SUPABASE_ACCESS_TOKEN (personal access token
#   from https://supabase.com/dashboard/account/tokens) to let this workflow
#   dynamically whitelist the runner IP before connecting.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print SQL without executing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply SQL Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Whitelist runner IP (requires SUPABASE_ACCESS_TOKEN secret)
        # This step is SKIPPED if you haven't set SUPABASE_ACCESS_TOKEN.
        # If skipped, make sure you have manually added GitHub Actions IPs
        # or 0.0.0.0/0 to the Supabase network allowlist.
        # secrets context cannot be used in if conditions — always run but skip if token is empty
        # The step itself handles the empty-token case gracefully
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping IP whitelist."
            echo "Make sure GitHub Actions IPs or 0.0.0.0/0 are in the Supabase allowlist."
            exit 0
          fi
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP"

          # First: check current restrictions
          echo "--- GET current restrictions ---"
          GET_HTTP=$(curl -s -o /tmp/get_resp.txt -w "%{http_code}" \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          GET_BODY=$(cat /tmp/get_resp.txt)
          echo "GET HTTP $GET_HTTP: $GET_BODY"
          {
            echo "## Supabase Network Restrictions Debug"
            echo "GET HTTP: $GET_HTTP"
            echo "GET Body: $GET_BODY"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "--- PUT to open 0.0.0.0/0 ---"
          HTTP_CODE=$(curl -s -o /tmp/whitelist_resp.txt -w "%{http_code}" \
            "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/network/restrictions" \
            -X PUT \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"dbAllowedCidrs":["0.0.0.0/0"],"dbAllowedCidrsV6":[]}')
          BODY=$(cat /tmp/whitelist_resp.txt)
          echo "PUT HTTP $HTTP_CODE: $BODY"
          {
            echo "PUT HTTP: $HTTP_CODE"
            echo "PUT Body: $BODY"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "Network restrictions updated to allow all IPs."
            echo "Waiting 20s for propagation..."
            sleep 20
          else
            echo "WARNING: Failed to update network restrictions (HTTP $HTTP_CODE)"
            echo "Continuing anyway — connection may fail if IP is not whitelisted."
            echo ""
            echo "To fix manually:"
            echo "  https://supabase.com/dashboard/project/fvefwnojcqbdkcmfngnu/settings/network"
            echo "  Add 0.0.0.0/0 to Allowed CIDRs"
            # Don't exit 1 — let the DB connection step show the actual error
          fi

      - name: Verify DB connection
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: postgresql://postgres.fvefwnojcqbdkcmfngnu:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:5432/postgres
        run: |
          echo "Testing connection via Supabase session pooler..."
          psql "$DB_URL" -c "SELECT current_database(), now();" \
            && echo "Connection OK" \
            || {
              echo ""
              echo "Connection FAILED — 'Host not in allowlist'"
              echo ""
              echo "To fix this, choose one of:"
              echo "  1. Go to https://supabase.com/dashboard/project/fvefwnojcqbdkcmfngnu/settings/network"
              echo "     and add 0.0.0.0/0 to Allowed CIDRs (simplest for CI/CD)"
              echo "  2. Add a SUPABASE_ACCESS_TOKEN secret (personal access token) so"
              echo "     this workflow can dynamically whitelist the runner IP."
              exit 1
            }

      - name: Create migrations tracking table
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: postgresql://postgres.fvefwnojcqbdkcmfngnu:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:5432/postgres
        run: |
          psql "$DB_URL" <<'SQL'
            CREATE TABLE IF NOT EXISTS _migrations (
              id          serial PRIMARY KEY,
              filename    text UNIQUE NOT NULL,
              applied_at  timestamptz NOT NULL DEFAULT now(),
              checksum    text
            );
          SQL
          echo "Migrations tracking table ready."

      - name: Run pending migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: postgresql://postgres.fvefwnojcqbdkcmfngnu:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:5432/postgres
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          MIGRATIONS_DIR="supabase/migrations"
          SUCCESS=0
          SKIPPED=0
          FAILED=0

          echo "=== FINDIT Logistic — Migration Runner ==="
          echo "Dry run: $DRY_RUN"
          echo ""

          for FILE in $(ls "$MIGRATIONS_DIR"/*.sql | sort); do
            BASENAME=$(basename "$FILE")
            CHECKSUM=$(sha256sum "$FILE" | awk '{print $1}')

            # Check if already applied
            APPLIED=$(psql "$DB_URL" -tAc \
              "SELECT COUNT(*) FROM _migrations WHERE filename = '$BASENAME';")

            if [ "$APPLIED" -gt "0" ]; then
              echo "  SKIP  $BASENAME (already applied)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "  RUN   $BASENAME"

            if [ "$DRY_RUN" = "true" ]; then
              echo "--- DRY RUN: would execute ---"
              cat "$FILE"
              echo "------------------------------"
              SUCCESS=$((SUCCESS + 1))
            else
              if psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$FILE"; then
                # Record migration as applied
                psql "$DB_URL" -c \
                  "INSERT INTO _migrations (filename, checksum) VALUES ('$BASENAME', '$CHECKSUM') ON CONFLICT (filename) DO NOTHING;"
                echo "  OK    $BASENAME"
                SUCCESS=$((SUCCESS + 1))
              else
                echo "  FAIL  $BASENAME"
                FAILED=$((FAILED + 1))
              fi
            fi
          done

          echo ""
          echo "=== Migration Summary ==="
          echo "  Applied : $SUCCESS"
          echo "  Skipped : $SKIPPED"
          echo "  Failed  : $FAILED"

          if [ "$FAILED" -gt "0" ]; then
            echo "ERROR: $FAILED migration(s) failed!"
            exit 1
          fi

          echo "All migrations completed successfully."
