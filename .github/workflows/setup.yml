name: Setup — DB Migration + Vercel Env Vars

on:
  workflow_dispatch:
  push:
    branches:
      - claude/continue-work-5DQ9A
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/setup.yml'

jobs:
  migrate-db:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SQL migration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get install -y postgresql-client -q

          # Try direct connection first
          DIRECT="postgresql://postgres:${PGPASSWORD}@db.fvefwnojcqbdkcmfngnu.supabase.co:5432/postgres"
          # Try pooler regions as fallback
          POOLER_E1="postgresql://postgres.fvefwnojcqbdkcmfngnu:${PGPASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
          POOLER_W2="postgresql://postgres.fvefwnojcqbdkcmfngnu:${PGPASSWORD}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
          POOLER_E2="postgresql://postgres.fvefwnojcqbdkcmfngnu:${PGPASSWORD}@aws-0-eu-west-2.pooler.supabase.com:5432/postgres"

          for CONN in "$DIRECT" "$POOLER_E1" "$POOLER_W2" "$POOLER_E2"; do
            echo "Trying: $(echo $CONN | sed 's/:.*@/:***@/')"
            if psql "$CONN" -c "SELECT 1" -c "\q" 2>&1; then
              echo "Connected! Running migration..."
              psql "$CONN" -f supabase/migrations/001_initial_schema.sql --set ON_ERROR_STOP=off
              echo "Migration complete"
              exit 0
            fi
          done
          echo "All connections failed"
          exit 1

  set-vercel-env:
    name: Set Vercel Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Set env vars and redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Get project ID
          PROJECT_JSON=$(curl -s "https://api.vercel.com/v9/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          PROJECT_ID=$(echo "$PROJECT_JSON" | python3 -c "
          import sys,json
          projects = json.load(sys.stdin).get('projects', [])
          match = next((p for p in projects if 'logistic' in p['name'].lower()), None)
          print((match or projects[0])['id'] if projects else '')
          ")
          echo "Vercel Project ID: $PROJECT_ID"

          set_env() {
            RESULT=$(curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$1\",\"value\":\"$2\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}")
            echo "$1: $(echo $RESULT | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('key', d.get('error',{}).get('message','ok')))")"
          }

          set_env "NEXT_PUBLIC_SUPABASE_URL"     "$SUPABASE_URL"
          set_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY"
          set_env "SUPABASE_SERVICE_ROLE_KEY"     "$SUPABASE_SERVICE_KEY"
          echo "All env vars set"
