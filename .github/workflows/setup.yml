name: Setup — DB Migrations + Vercel Env Vars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/setup.yml'

jobs:
  migrate-db:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "=== Running: $f ==="
            SQL=$(cat "$f")
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1]).read()}))" "$f")
            RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/fvefwnojcqbdkcmfngnu/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "$RESP"
          done

  set-vercel-env:
    name: Set Vercel Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Set env vars via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_NOTIFY: ${{ secrets.GH_NOTIFY_TOKEN }}
          SITE_URL: "https://logistic-six-alpha.vercel.app"
          ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_EMAIL: "enrique.eaguilarh@gmail.com"
        run: |
          PROJECT_ID="prj_S68LtSo2WYgAxmp7NFOF5Hxw1qz5"
          TEAM_ID="team_BrCUd1PJnqaQTOuhJFrDYsw3"

          set_env() {
            local key="$1" val="$2"
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'key':sys.argv[1],'value':sys.argv[2],'type':'encrypted','target':['production','preview']}))" "$key" "$val")
            RESP=$(curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "$key → $(echo $RESP | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('key', d.get('error',{}).get('message','?')))" 2>/dev/null)"
          }

          set_env "NEXT_PUBLIC_SUPABASE_URL"      "$SUPABASE_URL"
          set_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$SUPABASE_ANON"
          set_env "SUPABASE_SERVICE_ROLE_KEY"      "$SUPABASE_SERVICE"
          set_env "NEXT_PUBLIC_SITE_URL"           "$SITE_URL"
          set_env "GITHUB_TOKEN_NOTIFY"            "$GH_NOTIFY"
          set_env "ADMIN_SETUP_KEY"                "$ADMIN_SETUP_KEY"
          set_env "CRON_SECRET"                    "$CRON_SECRET"
          set_env "ADMIN_EMAIL"                    "$ADMIN_EMAIL"
          echo "Done."
