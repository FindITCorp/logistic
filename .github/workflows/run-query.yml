name: Run SQL Query (Manual)

# Runs an arbitrary SQL query against the Supabase database via the
# Management API — bypasses the DB IP allowlist.

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SQL query to execute"
        required: true
        type: string
      dry_run:
        description: "Dry run — print SQL without executing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  run-query:
    name: Execute SQL Query
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: fvefwnojcqbdkcmfngnu
      MGMT_API: https://api.supabase.com/v1
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Print SQL
        run: |
          echo "=== SQL to execute ==="
          echo "${{ github.event.inputs.sql }}"
          echo "======================"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"

      - name: Execute SQL
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          python3 - << 'EOF'
          import os, json, sys
          from urllib import request, error

          PROJECT_ID = os.environ["PROJECT_ID"]
          MGMT_API = os.environ["MGMT_API"]
          PAT = os.environ["SUPABASE_ACCESS_TOKEN"]
          SQL = os.environ.get("SQL_QUERY", "")

          if not SQL:
              print("ERROR: SQL_QUERY is empty")
              sys.exit(1)

          payload = json.dumps({"query": SQL}).encode("utf-8")
          req = request.Request(
              f"{MGMT_API}/projects/{PROJECT_ID}/database/query",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {PAT}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode("utf-8")
                  result = json.loads(body)
                  print("Result:")
                  print(json.dumps(result, indent=2))
          except error.HTTPError as e:
              body = e.read().decode("utf-8")
              print(f"ERROR HTTP {e.code}: {body}")
              sys.exit(1)
          EOF
        env:
          SQL_QUERY: ${{ github.event.inputs.sql }}

      - name: Dry run complete
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN — no changes made."
