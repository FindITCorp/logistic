name: Run SQL Query (Manual)

# Runs an arbitrary SQL query against the Supabase database via the
# Management API — bypasses the DB IP allowlist.

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SQL query to execute"
        required: true
        type: string
      dry_run:
        description: "Dry run — print SQL without executing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  run-query:
    name: Execute SQL Query
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: fvefwnojcqbdkcmfngnu
      MGMT_API: https://api.supabase.com/v1
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Print SQL
        run: |
          echo "=== SQL to execute ==="
          echo "${{ github.event.inputs.sql }}"
          echo "======================"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"

      - name: Execute SQL
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          SQL_QUERY: ${{ github.event.inputs.sql }}
        run: |
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'query': os.environ['SQL_QUERY']}))")
          RESULT=$(curl -s --max-time 60 -X POST \
            "${MGMT_API}/projects/${PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Result:"
          echo "$RESULT" | python3 -m json.tool 2>/dev/null || echo "$RESULT"

      - name: Dry run complete
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "DRY RUN — no changes made."
